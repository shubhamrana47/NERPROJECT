            <text x="245" y="12" fill="#2563EB" font-size="11" font-weight="700">8 (5%)</text>
            <rect x="0" y="18" width="293" height="8" rx="4" fill="#E2E8F0"/>
            <rect x="0" y="18" width="18" height="8" rx="4" fill="#2563EB"/>
