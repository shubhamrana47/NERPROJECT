            <text x="245" y="12" fill="#7C3AED" font-size="11" font-weight="700">54 (38%)</text>
            <rect x="0" y="18" width="293" height="8" rx="4" fill="#E2E8F0"/>
            <rect x="0" y="18" width="112" height="8" rx="4" fill="#7C3AED"/>
          </g>

          <!-- Bar 3: Pests -->
