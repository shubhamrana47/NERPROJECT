            <text x="245" y="12" fill="#DC2626" font-size="11" font-weight="700">38 (27%)</text>
            <rect x="0" y="18" width="293" height="8" rx="4" fill="#E2E8F0"/>
            <rect x="0" y="18" width="79" height="8" rx="4" fill="#DC2626"/>
          </g>

