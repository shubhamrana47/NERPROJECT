        <rect x="0" y="0" width="226" height="60" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
        <text x="14" y="24" fill="#065F46" font-size="12" font-weight="700">1. Crop Specific Advisory</text>
