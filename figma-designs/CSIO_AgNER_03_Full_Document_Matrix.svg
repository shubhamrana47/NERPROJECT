      <text x="28" y="23" fill="#FFFFFF" font-size="12" font-weight="700">Download JSON file</text>
      <rect x="170" y="0" width="160" height="36" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
