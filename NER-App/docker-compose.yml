version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ner-backend-unified
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=${MONGO_URI:-mongodb+srv://<username>:<password>@cluster0.v5qxg7.mongodb.net/ner_annotation?appName=Cluster0}
      - CONFIDENCE_THRESHOLD=0.75
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000
    container_name: ner-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
