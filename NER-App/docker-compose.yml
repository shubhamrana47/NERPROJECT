version: '3.8'

services:
  ai-service:
    build:
      context: ./python-ai-service
      dockerfile: Dockerfile
    container_name: ner-ai-service
    ports:
      - "8000:8000"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ner-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=${MONGO_URI:-mongodb+srv://<username>:<password>@cluster0.v5qxg7.mongodb.net/ner_annotation?appName=Cluster0}
      - AI_SERVICE_URL=http://ai-service:8000
      - CONFIDENCE_THRESHOLD=0.75
    depends_on:
      - ai-service
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ner-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
